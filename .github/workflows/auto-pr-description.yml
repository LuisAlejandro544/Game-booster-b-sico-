name: Auto Generate PR Title & Description

on:
  pull_request:
    types: [opened]

concurrency:
  group: auto-pr-desc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-pr-description:
    name: Generate PR Description from Commits
    runs-on: ubuntu-latest

    steps:
      - name: Resolve GitHub Auth Token
        id: auth-token
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "Using secrets.GH_PAT"
            echo "TOKEN=${{ secrets.GH_PAT }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.PERSONAL_ACCESS_TOKEN }}" ]; then
            echo "Using secrets.PERSONAL_ACCESS_TOKEN"
            echo "TOKEN=${{ secrets.PERSONAL_ACCESS_TOKEN }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.GH_TOKEN }}" ]; then
            echo "Using secrets.GH_TOKEN"
            echo "TOKEN=${{ secrets.GH_TOKEN }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.AUTO_PR_TOKEN }}" ]; then
            echo "Using secrets.AUTO_PR_TOKEN"
            echo "TOKEN=${{ secrets.AUTO_PR_TOKEN }}" >> $GITHUB_OUTPUT
          else
            echo "Using default secrets.GITHUB_TOKEN"
            echo "TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.auth-token.outputs.TOKEN }}
          fetch-depth: 0

      - name: Extract PR Commits (Exclusive History)
        id: get-commits
        run: |
          BASE_REF="${{ github.base_ref }}"
          echo "Fetching base branch origin/$BASE_REF..."
          git fetch origin "$BASE_REF" --depth=200

          # Extract only the commits belonging to this PR branch compared to base
          COMMIT_LIST=$(git log "origin/$BASE_REF..HEAD" --pretty=format:"- %s (%h)%n%b" --no-merges | sed '/^$/d')
          
          if [ -z "$COMMIT_LIST" ]; then
            echo "No new commits detected in PR range."
            echo "has_commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_commits=true" >> $GITHUB_OUTPUT
          echo "$COMMIT_LIST" > /tmp/pr_commits.txt
          echo "Extracted PR commits:"
          cat /tmp/pr_commits.txt

      - name: Generate PR Description via AI
        if: steps.get-commits.outputs.has_commits == 'true'
        id: generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os
          import sys
          import json
          import re
          import urllib.request
          import urllib.error

          commits_path = "/tmp/pr_commits.txt"
          if not os.path.exists(commits_path):
              print("No commits file found.")
              sys.exit(0)

          with open(commits_path, "r", encoding="utf-8") as f:
              commits_raw = f.read().strip()

          openrouter_key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()

          system_prompt = (
              "Eres un tech lead senior. Analiza la lista de commits de un Pull Request y genera:\n"
              "1. Primera linea: Un titulo conciso en formato Conventional Commits (ej. feat(hud): optimize resolution controls).\n"
              "2. Linea en blanco.\n"
              "3. Cuerpo en Markdown estructurado:\n"
              "   - ## 📋 Resumen de Cambios (2-3 oraciones ejecutivas de lo que hace este PR)\n"
              "   - ## 🚀 Funcionalidades y Mejoras (Lista con vinetas claras)\n"
              "   - ## 🛠️ Detalles Tecnicos (Modulos o componentes tocados)\n"
              "   - ## 📦 Commits Incluidos\n"
              "No incluyas etiquetas ```markdown ni bloques de razonamiento internos en tu respuesta."
          )

          user_prompt = f"Genera el titulo y descripcion del PR para estos commits recientes:\n\n{commits_raw}"
          generated_text = ""

          # 1. Primary Attempt: OpenRouter (dots-studio/dots-3-note-preview:free)
          if openrouter_key:
              try:
                  print("Calling OpenRouter with dots-studio/dots-3-note-preview:free...")
                  payload = {
                      "model": "dots-studio/dots-3-note-preview:free",
                      "messages": [
                          {"role": "system", "content": system_prompt},
                          {"role": "user", "content": user_prompt}
                      ],
                      "reasoning": {
                          "effort": "high",
                          "exclude": True
                      },
                      "temperature": 0.2,
                      "max_tokens": 3000
                  }
                  req = urllib.request.Request(
                      "https://openrouter.ai/api/v1/chat/completions",
                      data=json.dumps(payload).encode("utf-8"),
                      headers={
                          "Authorization": f"Bearer {openrouter_key}",
                          "Content-Type": "application/json",
                          "HTTP-Referer": "https://github.com",
                          "X-Title": "GameBooster-AutoPR"
                      }
                  )
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      generated_text = data.get("choices", [{}])[0].get("message", {}).get("content", "")
              except Exception as e:
                  print(f"OpenRouter call failed: {e}")

          # 2. Fallback Attempt: Gemini API
          if not generated_text and gemini_key:
              try:
                  print("Calling Gemini API fallback...")
                  gemini_url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={gemini_key}"
                  payload = {
                      "contents": [{
                          "parts": [{"text": f"{system_prompt}\n\n{user_prompt}"}]
                      }],
                      "generationConfig": {
                          "temperature": 0.2,
                          "maxOutputTokens": 2000
                      }
                  }
                  req = urllib.request.Request(
                      gemini_url,
                      data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json"}
                  )
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      generated_text = data.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "")
              except Exception as e:
                  print(f"Gemini API call failed: {e}")

          # 3. Fallback Attempt: Local Structure
          if not generated_text:
              print("Using local parser fallback...")
              first_line = commits_raw.splitlines()[0].lstrip("- ") if commits_raw else "chore: update pull request changes"
              generated_text = (
                  f"{first_line}\n\n"
                  f"## 📋 Resumen del Pull Request\n"
                  f"Este Pull Request consolida los cambios y mejoras recientes del proyecto según el historial de commits.\n\n"
                  f"## 🚀 Cambios Implementados\n"
                  f"{commits_raw}\n\n"
                  f"---\n*Generado automáticamente por GitHub Actions basándose en los commits del PR.*"
              )

          # Clean any reasoning tags (<thought>, <think>)
          cleaned = re.sub(r'<(think|thought)>.*?</\1>', '', generated_text, flags=re.DOTALL)
          cleaned = re.sub(r'</?(think|thought)>', '', cleaned).strip()

          lines = cleaned.splitlines()
          title = lines[0].replace("#", "").strip() if lines else "chore: update pull request"
          body = "\n".join(lines[1:]).strip() if len(lines) > 1 else "No description provided."

          with open("/tmp/pr_title.txt", "w", encoding="utf-8") as f:
              f.write(title)
          with open("/tmp/pr_body.md", "w", encoding="utf-8") as f:
              f.write(body)

          print("Generated PR Title:", title)
          PYEOF

      - name: Update Pull Request Title and Body
        if: steps.get-commits.outputs.has_commits == 'true'
        env:
          GH_TOKEN: ${{ steps.auth-token.outputs.TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE=$(cat /tmp/pr_title.txt)
          echo "Updating PR #$PR_NUMBER with title: $PR_TITLE"
          gh pr edit "$PR_NUMBER" \
            --title "$PR_TITLE" \
            --body-file /tmp/pr_body.md
          
          echo "Pull Request #$PR_NUMBER updated successfully!"
